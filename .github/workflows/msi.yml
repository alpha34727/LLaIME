# Builds the installer without the Ministry of Education lexicon layer (CC BY-ND 3.0 TW, not
# redistributed): build\installer\LLaIME-<version>-x64.msi, kept as a workflow artifact, and
# attached to a GitHub release when a v* tag is pushed. The MSI is not code-signed.
#
# llama.cpp with its CUDA (four GPU architectures) and Vulkan backends takes hours on a hosted
# runner, so its install folder is cached, keyed on the llama.cpp commit, the build scripts and
# the SDK versions.
name: MSI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write  # attach the MSI to releases

concurrency:
  group: msi-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VERSION: "13.4.3"
  VULKAN_SDK_VERSION: "1.4.363.0"
  VULKAN_SDK_SHA256: "94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141"

jobs:
  msi:
    runs-on: windows-2025  # Visual Studio 2026
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag
      - name: CMake and Ninja (as on the development machine)
        run: |
          uv tool install cmake
          uv tool install ninja
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: llama.cpp cache key
        id: llama
        run: |
          $commit = git rev-parse HEAD:third_party/llama.cpp
          $patches = (Get-ChildItem patches/llama.cpp -Filter *.patch | Sort-Object Name | Get-FileHash | ForEach-Object Hash) -join ''
          $patchKey = [BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($patches))).Replace('-', '').Substring(0,12)
          "key=llama-$commit-cuda$env:CUDA_VERSION-vk$env:VULKAN_SDK_VERSION-$((Get-FileHash scripts/build-llama.ps1).Hash.Substring(0,12))-$((Get-FileHash scripts/fetch-cuda.ps1).Hash.Substring(0,12))-p$patchKey" |
            Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: llama-cache
        with:
          path: build/llama/Release/install
          key: ${{ steps.llama.outputs.key }}
      - name: CUDA Toolkit (redistributable archives)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-cuda.ps1 -Version $env:CUDA_VERSION
      - name: Vulkan SDK (LunarG)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          $v = $env:VULKAN_SDK_VERSION
          $exe = "$env:RUNNER_TEMP\vulkansdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe" -OutFile $exe
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($sha -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK sha256 $sha does not match" }
          & $exe --root "C:\VulkanSDK\$v" --accept-licenses --default-answer --confirm-command install | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed ($LASTEXITCODE)" }
          "VULKAN_SDK=C:\VulkanSDK\$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: llama.cpp (CPU, CUDA and Vulkan backends)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-llama.ps1 -Vulkan -CudaPath "$PWD\build\cuda\$env:CUDA_VERSION"

      - name: ONNX Runtime
        run: ./scripts/fetch-onnxruntime.ps1
      - name: Lexicon layers (McBopomofo, libchewing; no MOE)
        run: python tools/prepare_lexicon.py --no-moe
        env:
          PYTHONUTF8: "1"

      - name: Configure
        run: |
          cmake --preset x64
          cmake --preset x86
      - name: Build the MSI
        run: ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: LLaIME-msi
          path: build/installer/LLaIME-*-x64.msi
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/installer/LLaIME-*-x64.msi
          # Release notes from docs/releases/<tag>.md when there is one.
          body_path: ${{ hashFiles(format('docs/releases/{0}.md', github.ref_name)) != '' && format('docs/releases/{0}.md', github.ref_name) || '' }}
